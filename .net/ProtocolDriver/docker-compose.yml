version: '3.8'

services:
  protocol-driver-host:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./plugins:/app/plugins
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_ENVIRONMENT=Production
    restart: unless-stopped

