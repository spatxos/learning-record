name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore Host/Host.csproj

    - name: Build
      run: dotnet build --no-restore -c Release Host/Host.csproj

    - name: Publish
      run: dotnet publish --no-build -c Release -o ./publish Host/Host.csproj

    - name: Build Docker image
      run: docker build -t protocol-driver-host:${{ github.sha }} .

    - name: Login to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Push Docker image to Docker Hub
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag protocol-driver-host:${{ github.sha }} ${{ secrets.DOCKER_HUB_USERNAME }}/protocol-driver-host:latest
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/protocol-driver-host:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Setup Kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.26.0'

    - name: Deploy to Kubernetes
      env:
        KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      run: |
        echo "$KUBE_CONFIG" > ~/.kube/config
        kubectl apply -f kubernetes/deployment.yml
        kubectl rollout restart deployment protocol-driver-host